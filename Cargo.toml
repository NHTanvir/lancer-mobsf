[package]
name = "lancer-mobsf"
version = "0.1.0"
edition = "2021"
description = "Rust clone of mobsf — part of the Lancer bug bounty toolkit"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-mobsf"

[dependencies]
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "migrate", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
zip = "0.6"
regex = "1"
aho-corasick = "1"
goblin = "0.8"
plist = "1"
minijinja = "1"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = "0.21"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2"
bytes = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
