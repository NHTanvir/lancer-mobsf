  pattern: 'Log\.(d|v|i)\s*\(.*(?:password|secret|token)'
  severity: high
  input_case: lower
  cwe: CWE-532
  owasp: m2
  masvs: storage-3

- id: android_file_without_encryption
  message: "FileOutputStream detected without a cipher wrapper. Consider encrypting sensitive files."
  type: Regex
