  severity: info
  input_case: exact
  cwe: CWE-312
  owasp: m2
  masvs: storage-5

- id: android_preferences_world
  message: "SharedPreferences opened with MODE_WORLD_READABLE or MODE_WORLD_WRITABLE. All apps can read/write the preferences."
  type: Regex
  pattern: 'SharedPreferences.*MODE_WORLD'
  severity: high
  input_case: exact
  cwe: CWE-732
  owasp: m2
  masvs: storage-2

- id: android_room_no_encryption
  message: "Room databaseBuilder detected. Verify the database is encrypted if it stores sensitive data."
  type: Regex
  pattern: 'Room\.databaseBuilder'
  severity: info
  input_case: exact
  cwe: CWE-312
  owasp: m2
  masvs: storage-5

# ─── Network Security (8) ────────────────────────────────────────────────────

- id: android_http_tracking
  message: "Third-party tracking/analytics domain detected in source. Review privacy implications."
  type: Regex
  pattern: 'doubleclick\.net|analytics\.google|amplitude\.com'
  severity: info
  input_case: exact
  cwe: CWE-359
  owasp: m6
  masvs: privacy-4

- id: android_debug_server
  message: "Localhost or loopback address found in source. Remove debug server endpoints before release."
  type: Regex
  pattern: '"localhost"|"127\.0\.0\.1"|"0\.0\.0\.0"'
  severity: medium
  input_case: exact
  cwe: CWE-912
  owasp: m1
  masvs: resilience-4

- id: android_cert_pinning_bypass
  message: "OkHttp hostnameVerifier or checkValidity override detected. Certificate pinning may be bypassed."
  type: Regex
  pattern: 'okhttp.*hostnameVerifier|checkValidity'
  severity: high
  input_case: lower
  cwe: CWE-295
  owasp: m3
  masvs: network-4

- id: android_insecure_socket
  message: "Insecure SSL/TLS protocol (SSLv3 or TLS 1.0) explicitly enabled. Use TLS 1.2+."
  type: Regex
  pattern: 'setEnabledProtocols.*SSLv3|setEnabledProtocols.*TLSv1[^.]'
  severity: high
  input_case: exact
  cwe: CWE-327
  owasp: m3
  masvs: network-2

- id: android_proxy_settings
  message: "HTTP proxy set via System.setProperty. This can redirect traffic through an attacker-controlled proxy."
  type: Regex
  pattern: 'System\.setProperty.*http\.proxy'
  severity: info
  input_case: exact
  cwe: CWE-319
  owasp: m3
  masvs: network-1

- id: android_network_logs
  message: "OkHttp logging interceptor detected. Ensure it is disabled in release builds."
  type: Regex
  pattern: 'okhttp.*[Ll]ogging|[Ii]nterceptor.*[Ll]og'
  severity: info
  input_case: exact
  cwe: CWE-532
  owasp: m1
  masvs: storage-3

- id: android_gzip_disabled
  message: "Gzip/Content-Encoding disabled. This may waste bandwidth but is not a security issue by itself."
  type: Regex
  pattern: 'setDecompress.*false|AcceptEncoding.*identity'
  severity: info
  input_case: exact
  cwe: CWE-693
  owasp: m3
  masvs: network-1

- id: android_http_client_timeout
  message: "HTTP connection or read timeout configured. Ensure timeouts are appropriately set."
  type: Regex
  pattern: 'setConnectTimeout|setReadTimeout'
  severity: info
  input_case: exact
  cwe: CWE-400
  owasp: m3
  masvs: network-1

# ─── Component Security (8) ──────────────────────────────────────────────────

- id: android_fragment_injection
  message: "PreferenceActivity without isValidFragment check. Fragment injection may be possible on API < 19."
  type: Regex
  pattern: 'PreferenceActivity.*isValidFragment'
  severity: high
  input_case: exact
